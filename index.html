<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b16"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Turbo Gol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Teko:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed night stadium on canvas, broadcast scorebar pinned top, thumb controls in the lower corners. One dark look by design. */
:root{
  --night:#070b16;
  --panel:rgba(8,13,27,.88);
  --edge:rgba(160,185,240,.22);
  --chalk:#eaf1ff;
  --muted:#9aa8c7;
  --blue:#2f86ff;
  --orange:#ff7a1a;
  --orange-deep:#7a3206;
  --gold:#ffd84a;
  --curse:#ff3048;
  --curse-deep:#2a0610;
  --display:"Teko","Arial Narrow",Impact,system-ui,sans-serif;
  --ui:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Scorebar */
#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(6px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:6}
.scorebar{display:flex;height:40px;border-radius:6px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.5);font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;transform:skewX(-8deg)}
.sb-team{min-width:56px;display:grid;place-items:center;font-size:36px;line-height:1;padding:6px 12px 0}
.sb-blue{background:linear-gradient(180deg,#4797ff,#1d5fd0)}
.sb-orange{background:linear-gradient(180deg,#ff9440,#d9580a)}
.sb-clock{min-width:88px;display:grid;place-items:center;background:var(--panel);font-size:32px;line-height:1;padding:6px 12px 0;letter-spacing:.02em}
.sb-clock.ot{color:var(--gold)}
.iconbtn{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;z-index:11;border:1px solid var(--edge)}
.iconbtn svg{width:20px;height:20px}

/* Banners */
#banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
.bn{text-align:center;display:grid;justify-items:center;gap:8px}
#bnBig{font-family:var(--display);font-weight:700;font-size:clamp(84px,24vmin,190px);line-height:.78;padding-top:.12em;letter-spacing:.02em;transform:skewX(-8deg);text-shadow:0 6px 0 rgba(0,0,0,.4),0 0 48px currentColor}
#bnSub{font-weight:700;font-size:clamp(13px,3.4vmin,20px);letter-spacing:.12em;background:var(--panel);padding:6px 14px;border-radius:4px;border:1px solid var(--edge)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--edge);padding:6px 12px;border-radius:4px;font-weight:700;font-size:13px;letter-spacing:.08em;z-index:6;pointer-events:none;white-space:nowrap}
@media (orientation:portrait){#toast{top:calc(108px + env(safe-area-inset-top,0px))}}
#toast.curse{color:#ffd0d6;border-color:var(--curse);box-shadow:0 0 18px rgba(255,48,72,.4)}
#toast.ally{color:#d6e8ff;border-color:var(--blue)}
#toast.foe{color:#ffe0c8;border-color:var(--orange)}
#toast.gold{color:#fff3c4;border-color:var(--gold);box-shadow:0 0 18px rgba(255,216,74,.35)}
.ultline{position:absolute;left:50%;top:calc(49px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:196px;display:grid;justify-items:center;gap:3px}
.ultline i{display:block;width:100%;height:4px;background:rgba(234,241,255,.14);border-radius:2px;overflow:hidden}
#ultFill{display:block;height:100%;width:0;background:var(--gold)}
#ultNext{font-size:10px;font-weight:700;letter-spacing:.14em;background:var(--panel);padding:2px 8px;border-radius:3px;white-space:nowrap}

/* Touch controls */
#controls{position:fixed;inset:0;z-index:5;pointer-events:none}
#joyZone{position:absolute;left:0;top:0;bottom:0;width:50%;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:96px;top:70%;width:124px;height:124px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(234,241,255,.3);background:radial-gradient(circle,rgba(234,241,255,.12),rgba(234,241,255,.03));pointer-events:none;opacity:.45;transition:opacity .15s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c3cfe9);box-shadow:0 3px 12px rgba(0,0,0,.5)}
.pad{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:196px;height:120px;pointer-events:none}
.cbtn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;align-content:center;font-weight:700;letter-spacing:.12em;font-size:11px;transition:transform .06s}
.cbtn.down{transform:scale(.92);filter:brightness(1.45)}
#boostBtn{right:0;bottom:0;width:98px;height:98px;background:radial-gradient(circle at 50% 38%,rgba(255,216,74,.26),rgba(8,13,27,.72));color:var(--gold)}
#boostBtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
#boostBtn .trk{fill:none;stroke:rgba(255,216,74,.2);stroke-width:6}
#boostArc{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:289.03;stroke-dashoffset:190}
#boostNum{font-family:var(--display);font-size:38px;line-height:.75;padding-top:6px;letter-spacing:0;font-weight:600;font-variant-numeric:tabular-nums}
#jumpBtn{right:112px;bottom:8px;width:82px;height:82px;background:radial-gradient(circle at 50% 38%,rgba(234,241,255,.22),rgba(8,13,27,.72));border:2px solid rgba(234,241,255,.5)}
#jumpBtn svg{width:30px;height:22px;margin-bottom:2px}
/* Skill column: landscape stacks over TURBO, portrait lines up above ZIPLA/TURBO */
.skills{position:absolute;right:calc(33px + env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:60px;height:192px;pointer-events:none}
.sk{right:0;width:60px;height:60px;font-size:9px;letter-spacing:.08em;color:#fff;overflow:hidden}
.sk svg{width:22px;height:22px;margin-bottom:1px;position:relative;z-index:1}
.sk span{position:relative;z-index:1;font-variant-numeric:tabular-nums}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,8,16,.8) calc(var(--cd,0) * 1turn),transparent 0);pointer-events:none}
.sk.cool{filter:saturate(.3) brightness(.85)}
.sk.cool span{font-family:var(--display);font-size:22px;line-height:.8;letter-spacing:0;padding-top:3px}
#cleaveBtn{bottom:0;background:radial-gradient(circle at 50% 35%,#4a0c1a,var(--curse-deep));border:2px solid var(--curse);box-shadow:0 0 14px rgba(255,48,72,.45)}
#fireBtn{bottom:66px;background:radial-gradient(circle at 50% 35%,#ffb347,#e2431a 60%,#7a1a06);box-shadow:0 0 14px rgba(255,110,30,.5)}
#ultBtn{bottom:132px;background:radial-gradient(circle at 50% 35%,#fff3b0,#ffb800 55%,#8a5200);color:#2a1400;box-shadow:0 0 18px rgba(255,200,60,.7);animation:ultpulse .9s ease-in-out infinite alternate}
#ultBtn.ult-sukuna{background:radial-gradient(circle at 50% 35%,#ff7484,#a3001c 55%,#2a0610);color:#fff;box-shadow:0 0 18px rgba(255,48,72,.75)}
.skills.solo #ultBtn{bottom:0}
.sk.armed{animation:armed .45s ease-in-out infinite alternate}
@media (orientation:portrait){
  .skills{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:180px;height:56px}
  .sk{width:56px;height:56px}
  #cleaveBtn,#fireBtn,#ultBtn{bottom:0}
  #cleaveBtn{right:0}#fireBtn{right:62px}#ultBtn{right:124px}
  .skills.solo #ultBtn{right:0}
}
@keyframes armed{from{box-shadow:0 0 10px rgba(255,180,60,.6)}to{box-shadow:0 0 30px 8px rgba(255,200,80,.95)}}
@keyframes ultpulse{from{transform:scale(1)}to{transform:scale(1.07)}}

/* Menus */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:flex-start;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,rgba(7,11,22,.94) 0%,rgba(7,11,22,.8) 50%,rgba(7,11,22,.6) 100%);overflow:auto;touch-action:pan-y}
.overlay.center{align-items:center;justify-content:center;background:rgba(7,11,22,.74)}
.menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 32px;align-items:end;width:min(780px,100%);margin-block:auto 0}
.brand{display:grid;gap:10px;justify-items:start}
.kicker{font-size:12px;letter-spacing:.26em;color:var(--muted);font-weight:600}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(66px,16vmin,128px);line-height:.74;padding-top:.1em;margin:0;transform:skewX(-10deg);transform-origin:left bottom;letter-spacing:.01em;white-space:nowrap}
.logo .t1{color:var(--blue);text-shadow:0 0 30px rgba(47,134,255,.45)}
.logo .t2{color:var(--orange);text-shadow:0 0 30px rgba(255,122,26,.45)}
.tag{margin:0;color:var(--chalk);font-size:14px;line-height:1.45;max-width:34ch}
.play{width:100%;max-width:340px;padding:14px 18px 8px;background:var(--orange);color:#1c0b00;font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;letter-spacing:.08em;border-radius:6px;transform:skewX(-8deg);box-shadow:0 7px 0 var(--orange-deep),0 14px 34px rgba(255,122,26,.32)}
.play:active{transform:skewX(-8deg) translateY(4px);box-shadow:0 3px 0 var(--orange-deep)}
.opts{display:grid;gap:10px;min-width:0}
.opt{display:grid;gap:5px}
.lbl{font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:rgba(234,241,255,.05);border:1px solid var(--edge);border-radius:6px;padding:3px;gap:3px}
.seg button{padding:9px 4px;border-radius:4px;font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#0a1020}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin:2px 0 0}
.help b{color:var(--chalk);font-weight:600}
.gbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:340px;padding:8px 14px;border-radius:6px;border:1px solid var(--edge);background:rgba(234,241,255,.06);font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--muted)}
.gbtn b{font-family:var(--display);font-weight:600;font-size:26px;line-height:.8;padding-top:4px;letter-spacing:.04em;color:var(--gold)}
/* Garage: one card per character, the picked one ringed in gold */
.garage{width:min(880px,100%);display:grid;gap:12px;margin:auto}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g-head h2{font-family:var(--display);font-weight:700;font-size:54px;line-height:.75;padding-top:.12em;margin:0;transform:skewX(-8deg);transform-origin:left bottom}
.g-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.g-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{position:relative;text-align:left;display:grid;gap:7px;align-content:start;padding:12px;border-radius:10px;background:var(--panel);border:2px solid var(--edge);min-width:0;color:var(--chalk)}
.gcard[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(255,216,74,.16)}
.gcard canvas{display:block;width:100%;height:78px;border-radius:6px;background:radial-gradient(ellipse at 50% 60%,#1d6b47,#0e2a22 70%)}
.g-name{font-family:var(--display);font-weight:700;font-size:34px;line-height:.75;padding-top:.12em;transform:skewX(-8deg);transform-origin:left bottom}
.g-role{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.g-list{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:12px;line-height:1.35;font-weight:500}
.g-list b{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.g-list b em{font-style:normal;color:var(--chalk);letter-spacing:.04em}
.g-list .ult b{color:var(--gold)}
.gcard.locked{opacity:.5}
.g-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.14em;padding:3px 7px;border-radius:3px;background:var(--gold);color:#1c1200}
.gcard.locked .g-badge{background:rgba(234,241,255,.16);color:var(--chalk)}
@media (orientation:portrait){.g-cards{grid-template-columns:minmax(0,1fr)}.gcard canvas{height:64px}}
@media (orientation:landscape) and (max-height:430px){.g-head h2{font-size:42px}.gcard canvas{height:56px}.gcard{padding:10px}.g-list{font-size:11px}}
@media (orientation:portrait){
  .menu{grid-template-columns:minmax(0,1fr)}
  .overlay:not(.center){background:linear-gradient(0deg,rgba(7,11,22,.96) 0%,rgba(7,11,22,.8) 58%,rgba(7,11,22,.15) 100%)}
  .play{max-width:none}
}
.sheet{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px;width:min(440px,100%);display:grid;gap:14px;margin:auto}
.sheet h2{font-family:var(--display);font-weight:700;font-size:58px;line-height:.75;padding-top:.12em;margin:0;transform:skewX(-8deg);transform-origin:left bottom}
.final{font-family:var(--display);font-weight:600;font-size:66px;line-height:.75;padding-top:.1em;display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums}
.final .fb{color:var(--blue)} .final .fo{color:var(--orange)} .final .dash{color:var(--muted);font-size:40px}
.stats{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:5px 18px;margin:0;font-size:14px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn{padding:12px 10px;border-radius:6px;background:rgba(234,241,255,.07);border:1px solid var(--edge);font-weight:700;letter-spacing:.06em;font-size:14px}
.btn.primary{background:var(--orange);color:#1c0b00;border-color:transparent}
@media (orientation:landscape) and (max-height:430px){
  .sheet{padding:14px 18px;gap:10px}
  .sheet h2{font-size:46px}
  .final{font-size:52px}
}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cbtn{transition:none}#fireBtn.armed{animation:none;box-shadow:0 0 26px 6px rgba(255,200,80,.9)}}
</style>

<canvas id="cv" aria-label="Turbo Gol sahası"></canvas>
<div id="sa" aria-hidden="true"></div>

<div id="hud" hidden>
  <div class="scorebar">
    <div class="sb-team sb-blue" id="sBlue">0</div>
    <div class="sb-clock" id="clock">3:00</div>
    <div class="sb-team sb-orange" id="sOrange">0</div>
  </div>
  <div class="ultline" id="ultLine" hidden><i><em id="ultFill"></em></i><span id="ultNext" hidden></span></div>
</div>
<button id="pauseBtn" class="iconbtn" hidden aria-label="Duraklat"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
<div id="toast" hidden></div>
<div id="banner" hidden><div class="bn" id="bnWrap"><div id="bnBig"></div><div id="bnSub"></div></div></div>

<div id="controls" hidden>
  <div id="joyZone"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="skills" id="skills" hidden>
    <button class="cbtn sk" id="fireBtn" aria-label="Alevli vuruş"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.6 1.3-4.2 2.6-5.4.2 1.7 1 2.8 2.1 3.4C11.2 8 11 5 12 2z"/></svg><span id="fireLbl">ALEV</span></button>
    <button class="cbtn sk" id="cleaveBtn" aria-label="Cleave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20L20 4M3 13L13 3M11 21L21 11"/></svg><span id="cleaveLbl">CLEAVE</span></button>
    <button class="cbtn sk" id="ultBtn" aria-label="Ulti"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.6 6.6 7 .5-5.4 4.5 1.7 6.9L12 16.2 6.1 20l1.7-6.9L2.4 8.6l7-.5z"/></svg><span id="ultLbl">ULTİ</span></button>
  </div>
  <div class="pad">
    <button class="cbtn" id="jumpBtn" aria-label="Zıpla"><svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,18 15,6 26,18"/></svg><span>ZIPLA</span></button>
    <button class="cbtn" id="boostBtn" aria-label="Turbo"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="46"/><circle id="boostArc" cx="50" cy="50" r="46"/></svg><b id="boostNum">33</b><span>TURBO</span></button>
  </div>
</div>

<section id="menu" class="overlay">
  <button id="soundBtn" class="iconbtn" aria-label="Sesi kapat"></button>
  <div class="menu">
    <div class="brand">
      <div class="kicker">ARABALI FUTBOL</div>
      <h1 class="logo"><span class="t1">TURBO</span> <span class="t2">GOL</span></h1>
      <p class="tag">Botlara karşı araba futbolu. Turbo bas, zıpla, havada takla atıp topu kaleye gönder.</p>
      <button id="playBtn" class="play">OYNA</button>
      <button id="garageBtn" class="gbtn">GARAJ <b id="garageName">KLASİK</b></button>
    </div>
    <div class="opts">
      <div class="opt"><div class="lbl">MOD</div><div class="seg" data-key="mode"><button id="m1" data-v="1">1v1</button><button id="m2" data-v="2">2v2</button><button id="m3" data-v="3">3v3</button></div></div>
      <div class="opt"><div class="lbl">ZORLUK</div><div class="seg" data-key="diff"><button id="d0" data-v="0">Kolay</button><button id="d1" data-v="1">Orta</button><button id="d2" data-v="2">Zor</button></div></div>
      <div class="opt"><div class="lbl">SÜRE</div><div class="seg" data-key="time"><button id="t2" data-v="120">2 dk</button><button id="t3" data-v="180">3 dk</button><button id="t5" data-v="300">5 dk</button></div></div>
      <p class="help" id="help"></p>
    </div>
  </div>
</section>

<section id="garage" class="overlay center" hidden>
  <div class="garage">
    <div class="g-head">
      <div><h2>GARAJ</h2><p>Arabanı seç. Yetenekler maç boyunca seninle, ulti maçta bir kere.</p></div>
      <button class="btn primary" id="garageDone">TAMAM</button>
    </div>
    <div class="g-cards" id="gCards"></div>
  </div>
</section>

<section id="pauseScr" class="overlay center" hidden>
  <div class="sheet">
    <h2>DURAKLATILDI</h2>
    <div class="btnrow">
      <button class="btn primary" id="resumeBtn">Devam</button>
      <button class="btn" id="restartBtn">Yeniden başlat</button>
      <button class="btn" id="toMenuBtn">Ana menü</button>
      <button class="btn" id="soundBtn2">Ses: Açık</button>
    </div>
  </div>
</section>

<section id="endScr" class="overlay center" hidden>
  <div class="sheet">
    <h2 id="endTitle">KAZANDIN!</h2>

/* ---------- Cars ---------- */
function makeCar(team, idx, human, name, char) {
  return { team, idx, human, name, char, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, ang: 0, boost: 33, onGround: true, canDodge: false, airT: 0,

function collide(o, r, rest, segs) {
  let hit = 0;
  for (const s of segs) {
    let t = ((o.x - s.ax) * s.ex + (o.y - s.ay) * s.ey) / s.l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = o.x - (s.ax + s.ex * t), dy = o.y - (s.ay + s.ey * t), d2 = dx * dx + dy * dy;

    if (vn < 0) { o.vx -= (1 + rest) * vn * nx; o.vy -= (1 + rest) * vn * ny; if (-vn > hit) hit = -vn; }
  }

}

function stepCar(c, dt) {

  const boosting = inn.boost && c.boost > .5;

function demolish(v, by, cause = 'bump') {

function carCar(a, b) {
  if (a.demo || b.demo || Math.abs(a.z - b.z) > CAR_H + 6) return;

}

/* ---------- Ball ---------- */
function resetBall() { Object.assign(ball, { x: 0, y: 0, z: BR, vx: 0, vy: 0, vz: 0, hidden: false, last: null, fire: 0, fireBy: null, home: null }); ball.trail.length = 0; }

// Klasik ulti: the ball bends toward the opponent goal, ignores cars and cannot enter its own team's net.
function steerHoming(dt) {
  const b = ball, h = b.home, atk = h.team === 0 ? 1 : -1;
  h.t += dt;
  const dx = atk * (L2 + 60) - b.x, dy = h.gy - b.y;
  const sp = Math.min(1250, Math.max(hyp(b.vx, b.vy), 650) + 700 * dt);
  const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(dy, dx);
  const turn = h.t > 3 ? Math.PI : (2.4 + 7 * h.t) * dt;

  b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp; b.vz = (52 - b.z) * 5;
}

function stepBall(dt) {
  const b = ball;
  if (b.home) steerHoming(dt); else b.vz -= GRAV * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if (b.z < BR) { b.z = BR; if (b.vz < -90) { if (b.vz < -380) Snd.bounce(-b.vz); b.vz = -b.vz * .58; } else b.vz = 0; }
  if (b.z > 640) { b.z = 640; b.vz = -Math.abs(b.vz) * .6; }
  if (Math.abs(b.x) > L2 + 2 && b.z > GH - BR) { b.z = GH - BR; if (b.vz > 0) b.vz = -b.vz * .4; }
  if (b.fire > 0) { b.fire -= dt; if (b.fire <= 0) { b.fire = 0; b.fireBy = null; } }
  const f = b.home ? 1 : b.fire > 0 ? Math.exp(-.06 * dt) : b.z <= BR + 1 ? Math.exp(-.42 * dt) : Math.exp(-.05 * dt);
  b.vx *= f; b.vy *= f;
  let h = collide(b, BR, .72, WALLS);
  if (b.z > GH - BR && Math.abs(b.x) < L2) h = Math.max(h, collide(b, BR, .72, MOUTHS));
  if (b.home) collide(b, BR, .72, [MOUTHS[b.home.team === 0 ? 1 : 0]]);

  b.spin += sp * dt / BR; if (sp > 15) b.dir = Math.atan2(b.vy, b.vx);
  if (!isFinite(b.x + b.y + b.z + b.vx + b.vy + b.vz)) resetBall();
}

  ['hud', 'pauseBtn', 'controls'].forEach(id => { $(id).hidden = false; });
  bannerEl.hidden = true; toastEl.hidden = true;
  setupMatch(false);

}
function toMenu() {
  ['endScr', 'pauseScr', 'hud', 'pauseBtn', 'controls'].forEach(id => { $(id).hidden = true; });
  $('menu').hidden = false; bannerEl.hidden = true; toastEl.hidden = true; skillsEl.hidden = true;
  setupMatch(true);
  keepAwake(false);
}
const SPEAKER_ON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 8l4 4M17 8l-4 4"/></svg>';
function applySound() {
  $('soundBtn').innerHTML = Snd.muted ? SPEAKER_OFF : SPEAKER_ON;
  $('soundBtn').setAttribute('aria-label', Snd.muted ? 'Sesi aç' : 'Sesi kapat');
  $('soundBtn2').textContent = Snd.muted ? 'Ses: Kapalı' : 'Ses: Açık';
}
const toggleSound = () => { Snd.init(); Snd.setMuted(!Snd.muted); applySound(); try { localStorage.setItem('turbogol.muted', Snd.muted ? '1' : '0'); } catch (_) {} };
try { Snd.muted = localStorage.getItem('turbogol.muted') === '1'; } catch (_) {}
$('soundBtn').addEventListener('click', toggleSound);
$('soundBtn2').addEventListener('click', toggleSound);
$('playBtn').addEventListener('click', startMatch);
$('againBtn').addEventListener('click', startMatch);
$('restartBtn').addEventListener('click', startMatch);
$('resumeBtn').addEventListener('click', () => togglePause(false));
$('pauseBtn').addEventListener('click', () => togglePause(true));
$('toMenuBtn').addEventListener('click', toMenu);
$('endMenuBtn').addEventListener('click', toMenu);
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings[seg.dataset.key] = Number(b.dataset.v); applySettingsUI(); saveSettings();
}));
function applySettingsUI() {
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === settings[seg.dataset.key]))));
  $('garageName').textContent = CHARS[settings.char].name;
  document.querySelectorAll('.gcard').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.char === settings.char)));
}

/* ---------- Garage ---------- */
function buildGarage() {
  const wrap = $('gCards'); wrap.textContent = '';
  for (const [key, ch] of Object.entries(CHARS)) {
    const card = document.createElement('button');
    card.className = 'gcard' + (ch.locked ? ' locked' : ''); card.id = 'g-' + key; card.dataset.char = key;
    if (ch.locked) card.setAttribute('aria-disabled', 'true');
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const item = (label, right, body, cls) => {
      const li = el('li', cls), b = el('b', null, label);
      if (right) b.append(el('em', null, right));
      li.append(b, document.createTextNode(body)); return li;
    };
    const list = el('ul', 'g-list');
    list.append(item('PASİF', '', ch.passive));
    for (const s of ch.skills) list.append(item(s.name, s.cd + ' sn', s.desc));
    if (ch.ult) list.append(item('ULTİ · ' + ch.ult.name, '1 kere', ch.ult.desc, 'ult'));
    card.append(el('canvas'), el('div', 'g-name', ch.name), el('div', 'g-role', ch.role), list);
    if (ch.locked) card.append(el('span', 'g-badge', 'YAKINDA'));
    card.addEventListener('click', () => {
      if (ch.locked) return;
      settings.char = key; saveSettings(); applySettingsUI();
    });
    wrap.append(card);
  }
  applySettingsUI();
}
function drawPreviews() {
  const d = Math.min(2, devicePixelRatio || 1);
  for (const [key, ch] of Object.entries(CHARS)) {
    const c = document.querySelector('#g-' + key + ' canvas'); if (!c) continue;
    const w = c.clientWidth, h = c.clientHeight; if (!w || !h) continue;
    c.width = Math.round(w * d); c.height = Math.round(h * d);
    const g = c.getContext('2d'), s = Math.min(w / 120, h / 62);
    g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
    g.translate(w / 2, h / 2 + 4 * s); g.scale(s, s);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(0, 6, 44, 18, 0, 0, 7); g.fill();
    g.rotate(-.32); g.scale(1.25, 1.25);
    if (ch.locked) { g.globalAlpha = .55; paintCar(g, 0, 'klasik'); g.globalAlpha = 1; }
    else paintCar(g, 0, key);
  }
}
function openGarage() { $('menu').hidden = true; $('garage').hidden = false; requestAnimationFrame(drawPreviews); }
$('garageBtn').addEventListener('click', openGarage);
$('garageDone').addEventListener('click', () => { $('garage').hidden = true; $('menu').hidden = false; });
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
$('help').innerHTML = isTouch
  ? '<b>Sol yarı:</b> parmağını sürükle, araba o yöne gider. <b>TURBO</b> basılı tut. <b>ZIPLA</b>, havadayken bir daha bas: takla vuruşu.<br><b>Ulti</b> sırayla herkese bir kere gelir, önce geride olan takıma.'
  : '<b>WASD / oklar</b> sür · <b>Boşluk</b> zıpla, havada tekrar bas: takla · <b>Shift</b> turbo · <b>Esc</b> duraklat<br><b>Q</b> alev · <b>E</b> cleave · <b>R</b> ulti. Ulti sırayla herkese bir kere gelir, önce geride olan takıma.';
if (!isTouch) joy.style.display = 'none';

/* ---------- Loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = clamp(dt, 0, .1);
  if (!game.paused) {
    if (game.state !== 'end') {
      predict(); computeDanger(); assignRoles();
      for (const c of cars) c.human ? humanControl(c) : aiControl(c, dt);
    }
    acc += dt; let n = 0;
    while (acc >= DT && n < 12) { physics(DT); acc -= DT; n++; }
    if (n >= 12) acc = 0;
    if (game.state !== 'end') { updateGame(dt); pickupPads(); emitFx(); }
    updParts(dt);
    for (let i = pendingCleave.length - 1; i >= 0; i--) {
      const pc = pendingCleave[i]; pc.t -= dt;
      if (pc.t <= 0) { pendingCleave.splice(i, 1); demolish(pc.c, pc.by, 'cleave'); }
    }
    for (let i = slashes.length - 1; i >= 0; i--) { slashes[i].t -= dt; if (slashes[i].t <= 0) slashes.splice(i, 1); }
    view.shake *= Math.exp(-8 * dt);
    game.flash = Math.max(0, game.flash - dt * 2.2);
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) bannerEl.hidden = true; }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  }
  render();
  updateHUD();
  Snd.loop();
}

function boot(data) {
  if (data && data.settings) Object.assign(settings, data.settings);
  if (!validChar(settings.char)) settings.char = 'klasik';
  buildGarage(); applySound();
  layout();
  setupMatch(true);
  addEventListener('resize', () => { layout(); if (!$('garage').hidden) drawPreviews(); });
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildField()).catch(() => {});
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ settings })); } catch (_) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
